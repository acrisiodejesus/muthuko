<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  
  <!-- Fundo Circular com borda de alto contraste -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="84" fill="none" stroke="#f59e0b" stroke-width="8" stroke-dasharray="16 12"/>
  
  <!-- Pistas de circuito eletrónico estilizadas -->
  <path d="M 96 140 H 210 L 256 186 V 290" fill="none" stroke="#06b6d4" stroke-width="8" stroke-linecap="round"/>
  <circle cx="96" cy="140" r="14" fill="#06b6d4"/>
  <circle cx="256" cy="290" r="10" fill="#06b6d4"/>
  
  <path d="M 416 140 H 302 L 256 186" fill="none" stroke="#06b6d4" stroke-width="8" stroke-linecap="round"/>
  <circle cx="416" cy="140" r="14" fill="#06b6d4"/>

  <!-- Placa de circuito central / Chip / Escudo de Confiança -->
  <rect x="146" y="166" width="220" height="220" rx="36" fill="#1e293b" stroke="url(#gold)" stroke-width="10"/>
  
  <!-- Letra 'M' em destaque técnico -->
  <path d="M 186 330 V 210 L 256 280 L 326 210 V 330" fill="none" stroke="#f8fafc" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Parafusos / Pads nos 4 cantos do chip -->
  <circle cx="176" cy="196" r="8" fill="#f59e0b"/>
  <circle cx="336" cy="196" r="8" fill="#f59e0b"/>
  <circle cx="176" cy="356" r="8" fill="#f59e0b"/>
  <circle cx="336" cy="356" r="8" fill="#f59e0b"/>
  
  <!-- Selo inferior "NAMPULA" / "MUTHUKO" -->
  <rect x="126" y="406" width="260" height="52" rx="26" fill="#f59e0b"/>
  <text x="256" y="440" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="900" fill="#0f172a" text-anchor="middle" letter-spacing="4">MUTHUKO</text>
</svg>
